# Production hardening overlay
# Usage: docker compose -f compose.yml -f compose.production.yml up -d

x-security: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    <<: *hardened
    image: ${APP_IMAGE:-superfly-app}:${APP_VERSION:-latest}
    # No build: in production — use pre-built image
    build: !reset null
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
        reservations:
          memory: 512M
    environment:
      SUPERFLY_CRYPTO_SECRET: ${SUPERFLY_CRYPTO_SECRET:?set SUPERFLY_CRYPTO_SECRET}
      SUPERFLY_CRYPTO_SALT: ${SUPERFLY_CRYPTO_SALT:?set SUPERFLY_CRYPTO_SALT}
      # an explicit choice: without it, behind a proxy all users share the proxy IP in the login IP limit
      JETTY_TRUST_FORWARDED: ${JETTY_TRUST_FORWARDED:?set JETTY_TRUST_FORWARDED (true behind a proxy)}
    restart: unless-stopped
    logging: *prod-logging
    # backend is internal (no host access), so the app also joins frontend,
    # which carries the published port from compose.yml. Bind it to loopback
    # or front it with a reverse proxy.
    networks:
      - backend
      - frontend

  mysql:
    <<: *hardened
    cap_add:
      # entrypoint chowns the data dir and drops from root to the mysql user
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    # MySQL needs a writable data dir — override read_only for specific paths
    read_only: false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512
        reservations:
          memory: 512M
    restart: unless-stopped
    logging: *prod-logging
    # No ports exposed — app connects via internal Docker network only

networks:
  backend:
    internal: true
  frontend:
