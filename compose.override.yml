# Development overrides — auto-loaded by docker compose.
# The app itself is run from the IDE or with ./dev-env.sh app (Start.java with
# src/main/webapp); this file only publishes MySQL to the host.

services:
  mysql:
    # Expose MySQL port to host for GUI clients (DBeaver, IntelliJ, etc.)
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
