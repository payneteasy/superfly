<html xmlns:wicket>
<head>
<wicket:head>
  <style type="text/css"></style>
</wicket:head>
</head>
<body>
<wicket:panel>
 <form wicket:id="form-mapping">

     <div class="row">

         <div class="col-12 col-sm-5">

            <input type="text" id="unmapped-query" class="form-control s-mapping-input" autocomplete="off" placeholder="Type to search"/>

            <!--table     -->
             <wicket:container wicket:id="checkgroup-unmapped">
                 <div  class="s-mapping-table">
                     <div class="s-mapping-header row">
                         <div class="col-1 s-mapping-chb-item"><input type="checkbox" id="master-checkbox-unmap"/></div>
                         <div class="col-11">Available <span wicket:id="unmapped-item-name"></span></div>
                     </div>
                     <ul id="unmapped-list" class="s-mapping-body list-unstyled">
                         <li class="s-mapping-row row" wicket:id="unmapped-list">
                             <div class="col-1 s-mapping-chb-item"><input type="checkbox" wicket:id="selected" /></div>
                             <div class="col-11" wicket:id="mapped-name"></div>
                         </li>
                     </ul>
                 </div>
             </wicket:container>
         </div>

         <div class="col-sm-2 s-mapping-middle">
             <input type="submit" value="Grant &gt;"wicket:id="add-items" class="btn btn-sm btn-block btn-outline-success"/>
             <input type="submit" value="&lt; Prohibit"wicket:id="remove-items" class="btn btn-sm btn-block btn-outline-danger mt-3"/>
         </div>

         <div class="col-sm-5">

             <input type="text" id="mapped-query" class="form-control s-mapping-input" autocomplete="off" placeholder="Type to search"/>

             <!--table-->
             <wicket:container wicket:id="checkgroup-mapped">
                 <div class="s-mapping-table border-success shadow">
                     <ul class="s-mapping-header list-unstyled">
                         <li class="s-mapping-row row" >
                             <div class="col-1 s-mapping-chb-item"><input type="checkbox" id="master-checkbox-map"/></div>
                             <div class="col-11">Granted <span wicket:id="mapped-item-name"></span></div>
                         </li>
                     </ul>

                     <ul id="mapped-list" class="s-mapping-body list-unstyled">
                         <li class="s-mapping-row row" wicket:id="mapped-list">
                             <div class="col-1 s-mapping-chb-item"><input type="checkbox" wicket:id="selected" /></div>
                             <div class="col-11" wicket:id="mapped-name"></div>
                         </li>
                     </ul>

                 </div>
             </wicket:container>
         </div>
     </div>

</form>
    <script type="text/javascript" src="js/jquery.livesearch.js"></script>
    <script type="text/javascript">
        // The header checkbox toggles only the rows currently shown by the live
        // filter, so "select all" never reaches rows hidden by the search. We
        // mirror fastLiveFilter exactly: same element set (list.children) and the
        // same hidden test it uses (style.display === 'none').
        function bindMasterCheckbox(masterId, queryId, listId) {
            var master = document.getElementById(masterId);
            var list   = document.getElementById(listId);
            var query  = document.getElementById(queryId);
            if (!master || !list) { return; }

            function visibleRowCheckboxes() {
                var result = [];
                var rows = list.children;
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].style.display === 'none') { continue; }
                    var inputs = rows[i].getElementsByTagName('input');
                    for (var j = 0; j < inputs.length; j++) {
                        if (inputs[j].type === 'checkbox') { result.push(inputs[j]); }
                    }
                }
                return result;
            }
            function syncMaster() {
                var boxes = visibleRowCheckboxes(), checked = 0;
                for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) { checked++; } }
                master.checked = boxes.length > 0 && checked === boxes.length;
                master.indeterminate = checked > 0 && checked < boxes.length;
            }
            master.addEventListener('change', function() {
                var boxes = visibleRowCheckboxes();
                for (var i = 0; i < boxes.length; i++) { boxes[i].checked = master.checked; }
            });
            list.addEventListener('change', function(e) {
                if (e.target && e.target.type === 'checkbox') { syncMaster(); }
            });
            if (query) { query.addEventListener('input', syncMaster); }
            syncMaster();
        }
        $(document).ready(function(){
            $("#unmapped-query").fastLiveFilter('#unmapped-list').focus();
            $("#mapped-query").fastLiveFilter('#mapped-list');
            bindMasterCheckbox('master-checkbox-unmap', 'unmapped-query', 'unmapped-list');
            bindMasterCheckbox('master-checkbox-map',   'mapped-query',   'mapped-list');
        });
    </script>
</wicket:panel>
</body>
</html>
