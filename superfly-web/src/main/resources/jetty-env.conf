<Configure>
    <New id="txDatasource" class="org.eclipse.jetty.plus.jndi.Resource">
        <Arg><Ref refid='wac'/></Arg>
        <Arg>java:comp/env/jdbc/superfly</Arg>
        <Arg>
            <New class="org.apache.commons.dbcp.BasicDataSource">
                <Set name="url">jdbc:mysql://<SystemProperty name="db.host" default="localhost"/>:<SystemProperty name="db.port" default="3344"/>/<SystemProperty name="db.name" default="sso"/>?characterEncoding=utf8&amp;useInformationSchema=true&amp;noAccessToProcedureBodies=false&amp;useLocalSessionState=true&amp;autoReconnect=false&amp;serverTimezone=<SystemProperty name="db.timezone" default="Europe/Moscow"/></Set>
                <Set name="driverClassName">com.mysql.cj.jdbc.Driver</Set>
                <Set name="username"><SystemProperty name="db.user" default="sso"/></Set>
                <Set name="password"><SystemProperty name="db.password" default="123sso123"/></Set>
                <Set name="accessToUnderlyingConnectionAllowed">true</Set>
                <Set name="testOnBorrow">true</Set>
                <Set name="validationQuery">{call create_collections()}</Set>
            </New>
        </Arg>
    </New>
</Configure>


